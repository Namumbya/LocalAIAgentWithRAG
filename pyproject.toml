[project]
name = "local-ai-agent-with-rag"
version = "0.1.0"
description = "Local agentic RAG demo with LangChain v1 tools and Ollama (sample: restaurant reviews)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.0,<2.0.0",
    "langchain-chroma>=1.1.0,<2.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "pandas>=2.2.0,<4.0.0",
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
restaurant-agent = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
files = [
    "constants.py",
    "logging_setup.py",
    "agent.py",
    "guardrails.py",
    "vector.py",
    "tools.py",
    "main.py",
]
